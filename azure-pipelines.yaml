name: CPP Context Verify & Validation

# Need to update this for actual migration
trigger:
  branches:
    include:
      - main
      - 'team/*'
    exclude:
      - 'dev/release-*'
  # No paths filter. Azure DevOps supports wildcards in BRANCH and TAG filters but NOT in
  # path filters, so the previous `paths: include: ['*']` was read as a literal path named
  # "*" - which no commit ever touches. The CI trigger's path condition was therefore never
  # satisfied and pushing to main or team/* queued no run at all.
  #
  # PR builds kept working and hid it: the `pr:` block below uses the simplified syntax,
  # which is a list of target BRANCHES with no path filter, so it was never affected.
  # Omitting paths entirely means "any path", which is what the '*' was trying to say.

pr:
  - '*'

resources:
  repositories:
    - repository: cppAzureDevOpsTemplates
      type: github
      name: hmcts/cpp-azure-devops-templates
      endpoint: 'hmcts'
      ref: 'main'

pool:
  name: "MDV-ADO-AGENT-AKS-01"
  demands:
    - identifier -equals centos8-j17


variables:
  sonarqubeProject: "uk.gov.moj.cpp.progression:progression-parent" # update eg: uk.gov.moj.cpp.listing:listing-parent
  service_Name: 'progression' # this should be service name. Image repository will be <serviceName>-service and should be in sysnc with aks-deploy repo.. eg : stagingbulkscan, hearing, systemidmapper
  itTest_Folder: 'progression-integration-test' # integration test folder name system-id-mapper-integration-test
  LANG: 'en_GB.UTF-8'
  LC_ALL: 'en_GB.UTF-8'

stages:
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      - template: pipelines/context-verify.yaml@cppAzureDevOpsTemplates
        parameters:
          sonarqube_project: ${{ variables['sonarqubeProject'] }}
          sonarQubeType: 'sonarQubeAKS'

  - ${{ if eq(variables['Build.Reason'], 'IndividualCI') }}:
      - template: pipelines/context-validation.yaml@cppAzureDevOpsTemplates
        parameters:
          repo: "$(Build.Repository.Name)"
          sonarQubeType: 'sonarQubeAKS'
          serviceName: ${{ variables['service_Name'] }}
          itTestFolder: ${{ variables['itTest_Folder'] }}
