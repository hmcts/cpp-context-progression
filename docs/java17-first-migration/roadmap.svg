<text x="70" y="1445" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183046">11 and 12 are separate PRs that must work together before the target release.</text>
<text x="70" y="1485" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183046">13 is stacked on 11 until its parent changes merge; it validates the matched 12 configuration.</text>
<text x="70" y="1540" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183046">Gate J17: behaviour preserved, DeltaSpike removal proven, Java 17 artifact releasable.</text>
<text x="70" y="1582" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183046">Gate TARGET: final source, runtime and business outcomes pass together.</text>
<text x="70" y="1637" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183046">People own acceptance, review, environment access and release decisions at each gate.</text>
<text x="70" y="1690" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183046">01–04 and 10 are drafts with open gates. Other branches remain proposed. Advance on accepted evidence.</text>
