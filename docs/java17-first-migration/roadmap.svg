<rect x="605" y="934" width="480" height="155" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="627" y="976" font-size="27" font-weight="700">11 Convert in Java 25 batches</text>
<text x="627" y="1015" font-size="23" font-weight="400">Cases and hearings → documents</text>
<text x="627" y="1048" font-size="23" font-weight="400">→ remaining → retire DeltaSpike</text>
<polyline points="846,865 846,934" fill="none" stroke="#536b7c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="56" y="1174" width="746" height="160" rx="12" fill="#f2f7f3" stroke="#91ac98" stroke-width="2"/>
<text x="78" y="1216" font-size="27" font-weight="700">13 Run combined target assurance</text>
<text x="78" y="1255" font-size="23" font-weight="400">Final source and runtime with PostgreSQL/JTA and MI results</text>
<text x="78" y="1288" font-size="23" font-weight="400">Reconcile main parity, business outcomes, performance and rollback</text>
<rect x="892" y="1174" width="750" height="160" rx="12" fill="#f2f7f3" stroke="#91ac98" stroke-width="2"/>
<text x="914" y="1216" font-size="27" font-weight="700">14 Authorise rollout and verify outcomes</text>
<text x="914" y="1255" font-size="23" font-weight="400">Release owner accepts the manifest, monitoring and stop criteria</text>
<text x="914" y="1288" font-size="23" font-weight="400">Verify actual runtime and representative event and query outcomes</text>
<polyline points="846,1089 846,1127 429,1127 429,1174" fill="none" stroke="#536b7c" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1402,782 1402,1148 721,1148 721,1174" fill="none" stroke="#536b7c" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="802,1253 892,1253" fill="none" stroke="#536b7c" stroke-width="3" marker-end="url(#arrow)"/>
