<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1380" viewBox="0 0 1700 1380" role="img" aria-labelledby="title desc">
<title id="title">Progression Java 25 pilot and migration roadmap</title>
<desc id="desc">Start the Java 25 application pilot from current main in parallel with platform prerequisite work. Refresh Java 17 baseline Steps 01 to 04 for comparison. Steps 05 to 09 form an optional Java 17 release lane. Qualify the pilot and matching runtime before expanding Java 25 conversion batches, running combined assurance and authorising rollout.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536b7c"/></marker>
</defs>
<rect width="1700" height="1380" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172e3b">
<text x="56" y="62" font-size="46" font-weight="700">Progression migration roadmap</text>
<text x="56" y="107" font-size="27" font-weight="400">Start the Java 25 pilot from current main. Refresh the Java 17 comparison in parallel.</text>
<text x="56" y="164" font-size="25" font-weight="700">Baseline and optional release</text>
<text x="605" y="164" font-size="25" font-weight="700">Default Java 25 route</text>
<text x="1162" y="164" font-size="25" font-weight="700">Platform qualification</text>
<rect x="56" y="188" width="475" height="185" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="78" y="230" font-size="27" font-weight="700">01–04 Refresh Java 17 baseline</text>
<text x="78" y="269" font-size="23" font-weight="400">Reproduce and characterise</text>
<text x="78" y="302" font-size="23" font-weight="400">Test support and lifecycle proof</text>
<text x="78" y="335" font-size="23" font-weight="400">Refresh evidence against current main</text>
<rect x="605" y="188" width="480" height="185" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="627" y="230" font-size="27" font-weight="700">11 Application pilot · PR 691</text>
<text x="627" y="269" font-size="23" font-weight="400">Started from current main</text>
<text x="627" y="302" font-size="23" font-weight="400">Upstream runtime slice passed</text>
<text x="627" y="335" font-size="23" font-weight="400">HMCTS runtime qualification open</text>
<rect x="1162" y="188" width="480" height="185" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="1184" y="230" font-size="27" font-weight="700">10 Qualify target inputs</text>
<text x="1184" y="269" font-size="23" font-weight="400">Parallel prerequisite work</text>
<text x="1184" y="302" font-size="23" font-weight="400">Resolve Hibernate and both MI inputs</text>
<text x="1184" y="335" font-size="23" font-weight="400">Draft PR 690 has open gates</text>
<rect x="56" y="477" width="475" height="211" rx="12" fill="#f7f7f7" stroke="#9da7ac" stroke-width="2"/>
<text x="78" y="519" font-size="27" font-weight="700">05–09 Optional Java 17 lane</text>
<text x="78" y="558" font-size="23" font-weight="400">05 Cases and hearings → 06 Documents</text>
<text x="78" y="591" font-size="23" font-weight="400">→ 07 Remaining → 08 Retire DeltaSpike</text>
<text x="78" y="624" font-size="23" font-weight="400">→ 09 Optional release checkpoint</text>
<text x="78" y="657" font-size="23" font-weight="400">Follow this lane if selected</text>
<rect x="1162" y="477" width="480" height="180" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="1184" y="519" font-size="27" font-weight="700">12 Match the target runtime</text>
<text x="1184" y="558" font-size="23" font-weight="400">Prepare after qualified Step 10</text>
<text x="1184" y="591" font-size="23" font-weight="400">Complete with buildable Step 11 artifact</text>
<text x="1184" y="624" font-size="23" font-weight="400">Verify actual WildFly and Hibernate</text>
<polyline points="294,373 294,477" fill="none" stroke="#536b7c" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="11 8"/>
