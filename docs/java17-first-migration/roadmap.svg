<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1535" viewBox="0 0 1700 1535" role="img" aria-labelledby="title desc">
<title id="title">Progression Java 25 first migration roadmap</title>
<desc id="desc">Start the full Java 25 reactor from live main, refresh the Java 17 comparison and qualify exact HMCTS platform and MI inputs in parallel. Prove the real application listener and JTA on the target, then convert the three repository batches in parallel, combine and assure them, and authorise one cutover. The optional Java 17 release is a separate historical option.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526b7b"/></marker></defs>
<rect width="1700" height="1535" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172e3b">
<text x="55" y="62" font-size="45" font-weight="700">Progression Java 25 first migration</text>
<text x="55" y="108" font-size="27" font-weight="400">Build, compare and qualify in parallel. Prove the listener before conversion and cut over once.</text>
<rect x="605" y="145" width="490" height="110" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="627" y="187" font-size="28" font-weight="700">Live Progression main</text>
<text x="627" y="227" font-size="23" font-weight="400">One pinned source revision</text>
<rect x="55" y="330" width="490" height="155" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="77" y="372" font-size="28" font-weight="700">01–04 Java 17 comparison</text>
<text x="77" y="412" font-size="23" font-weight="400">Reproduce the live-main baseline</text>
<text x="77" y="444" font-size="23" font-weight="400">Characterise contracts and lifecycle</text>
<rect x="605" y="330" width="490" height="155" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="627" y="372" font-size="28" font-weight="700">11 Build the full Java 25 reactor</text>
<text x="627" y="412" font-size="23" font-weight="400">Draft PR 692 from live main</text>
<text x="627" y="444" font-size="23" font-weight="400">Compile and package the application</text>
<rect x="1155" y="330" width="490" height="155" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="1177" y="372" font-size="28" font-weight="700">10 Qualify actual HMCTS inputs</text>
<text x="1177" y="412" font-size="23" font-weight="400">Pin platform, image and provider</text>
<text x="1177" y="444" font-size="23" font-weight="400">Qualify both MI contract inputs</text>
<polyline points="850,255 850,285 300,285 300,330" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="850,255 850,330" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="850,285 1400,285 1400,330" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="630" width="490" height="150" rx="12" fill="#f7f7f7" stroke="#9da7ac" stroke-width="2"/>
<text x="77" y="672" font-size="28" font-weight="700">09 Historical optional release</text>
<text x="77" y="712" font-size="23" font-weight="400">Separate Java 17 business decision</text>
<text x="77" y="744" font-size="23" font-weight="400">Independent scope and approval</text>
<rect x="605" y="630" width="1040" height="155" rx="12" fill="#f2f7f3" stroke="#91ac98" stroke-width="2"/>
<text x="627" y="672" font-size="28" font-weight="700">12 Prove the actual Progression listener on target</text>
<text x="627" y="712" font-size="23" font-weight="400">Match the application artifact, HMCTS WildFly image, PostgreSQL and JTA configuration</text>
<text x="627" y="744" font-size="23" font-weight="400">Verify EntityManager joining, flush, committed results, forced rollback and repeat delivery</text>
<polyline points="300,485 300,630" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="11 8"/>
<text x="320" y="568" font-size="20" font-weight="400">If requested</text>
<polyline points="500,485 500,565 678,565 678,630" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="850,485 850,630" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1400,485 1400,630" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="900" width="490" height="145" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="77" y="942" font-size="28" font-weight="700">05 Cases and hearings</text>
<text x="77" y="982" font-size="23" font-weight="400">Defendants, key grain, paging</text>
<text x="77" y="1014" font-size="23" font-weight="400">Preserve cardinality and outcomes</text>
<rect x="605" y="900" width="490" height="145" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="627" y="942" font-size="28" font-weight="700">06 Documents and material</text>
<text x="627" y="982" font-size="23" font-weight="400">Joins, placement and access</text>
<text x="627" y="1014" font-size="23" font-weight="400">Preserve visible document outcomes</text>
<rect x="1155" y="900" width="490" height="145" rx="12" fill="#edf5f8" stroke="#9ab2bf" stroke-width="2"/>
<text x="1177" y="942" font-size="28" font-weight="700">07 Remaining repositories</text>
<text x="1177" y="982" font-size="23" font-weight="400">Registers, notices and other users</text>
<text x="1177" y="1014" font-size="23" font-weight="400">Preserve SQL and workflow outcomes</text>
<polyline points="1100,785 1100,840 300,840 300,900" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="850,840 850,900" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1100,840 1400,840 1400,900" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1150" y="814" font-size="20" font-weight="400">Parallel reviewable batches</text>
<rect x="605" y="1122" width="490" height="145" rx="12" fill="#f2f7f3" stroke="#91ac98" stroke-width="2"/>
<text x="627" y="1164" font-size="28" font-weight="700">08 Combine and retire DeltaSpike</text>
<text x="627" y="1204" font-size="23" font-weight="400">Reconcile callers and dependencies</text>
<text x="627" y="1236" font-size="23" font-weight="400">Verify combined lifecycle and parity</text>
<polyline points="300,1045 300,1082 710,1082 710,1122" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="850,1045 850,1122" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1400,1045 1400,1082 990,1082 990,1122" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="1350" width="755" height="145" rx="12" fill="#f2f7f3" stroke="#91ac98" stroke-width="2"/>
<text x="77" y="1392" font-size="28" font-weight="700">13 Run one combined green pipeline</text>
<text x="77" y="1432" font-size="23" font-weight="400">Exact source and runtime, PostgreSQL/JTA and both MI contracts</text>
<text x="77" y="1464" font-size="23" font-weight="400">Current-main parity, performance and rollback evidence</text>
<rect x="890" y="1350" width="755" height="145" rx="12" fill="#f2f7f3" stroke="#91ac98" stroke-width="2"/>
<text x="912" y="1392" font-size="28" font-weight="700">14 Authorise one cutover</text>
<text x="912" y="1432" font-size="23" font-weight="400">Coordinated source and runtime rollout with stopping criteria</text>
<text x="912" y="1464" font-size="23" font-weight="400">Verify actual deployment and representative business outcomes</text>
<polyline points="850,1267 850,1300 430,1300 430,1350" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="810,1425 890,1425" fill="none" stroke="#526b7b" stroke-width="3" marker-end="url(#arrow)"/>
</g>
</svg>
