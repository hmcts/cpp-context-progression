<polyline points="1085,333 1124,333 1124,537 1162,537" fill="none" stroke="#536b7c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="605" y="710" width="480" height="155" rx="12" fill="#f2f7f3" stroke="#91ac98" stroke-width="2"/>
